<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexora · conceitos de layout</title>
<style>
:root{
  --fundo:#181716;--lateral:#121110;--sup:#24221F;--supa:#2E2B28;--borda:rgba(255,255,255,.14);--borda2:rgba(255,255,255,.08);
  --txt:#F2F0EC;--txt2:#C4C0B9;--txt3:#9C978F;--acento:#F2F0EC;--sobre:#161514;
  --rosa:#E59AC4;--verde:#7BCB9F;--laranja:#F0A860;--verm:#E8806C;--ciano:#86C5E6;
  --cod:#0F0E0D;--codt:#E6C38F;--bolha:#332F2C;--marca:#948BAE;--marca2:#5B5470;--estrela:255,255,255;
  --ui:Inter,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;--mono:"Cascadia Mono",Consolas,"SF Mono",monospace;
}
.claro{
  --fundo:#F7F6F4;--lateral:#EFEDEA;--sup:#FFFFFF;--supa:#E9E6E2;--borda:rgba(0,0,0,.15);--borda2:rgba(0,0,0,.08);
  --txt:#1C1B1A;--txt2:#45423E;--txt3:#615D58;--acento:#1C1B1A;--sobre:#FFFFFF;
  --rosa:#A3477A;--verde:#2F7D4F;--laranja:#A35E00;--verm:#B8402F;--ciano:#1F6F9E;
  --cod:#EFEDE9;--codt:#8A4B12;--bolha:#ECE9E4;--marca:#5B5470;--marca2:#3A3548;--estrela:60,50,90;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0b0a0a;color:#e8e6e2;font:14px/1.5 var(--ui);display:flex;flex-direction:column;align-items:center;padding:18px 18px 28px;gap:14px;min-height:100%}
body.claro-pagina{background:#d9d6d0;color:#1c1b1a}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.controle{width:min(1280px,100%);display:grid;gap:10px}
.linha{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.titulo-pg{font-size:20px;font-weight:600;letter-spacing:-.01em}
.sub-pg{color:#9c978f;font-size:13.5px}
.claro-pagina .sub-pg{color:#615d58}
.conceitos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.conceito{border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;text-align:left;background:rgba(255,255,255,.03);transition:.2s}
.claro-pagina .conceito{border-color:rgba(0,0,0,.14);background:rgba(255,255,255,.5)}
.conceito:hover{border-color:rgba(255,255,255,.3)}
.conceito.ativo{border-color:#948bae;background:rgba(148,139,174,.14)}
.conceito b{display:block;font-size:15px}
.conceito span{display:block;color:#a8a39b;font-size:12.8px;margin-top:3px}
.claro-pagina .conceito span{color:#55514c}
.alterna{display:inline-flex;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:3px;gap:2px}
.claro-pagina .alterna{border-color:rgba(0,0,0,.15)}
.alterna button{padding:5px 12px;border-radius:7px;font-size:13px;color:#a8a39b}
.alterna button.ativo{background:rgba(255,255,255,.12);color:inherit}
.claro-pagina .alterna button.ativo{background:rgba(0,0,0,.08)}
.nota{color:#9c978f;font-size:12.5px}
.palco{width:min(1280px,100%);aspect-ratio:1280/800;position:relative}
.janela{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:0 0;border-radius:12px;overflow:hidden;border:1px solid var(--borda);background:var(--fundo);color:var(--txt);font:13.5px/1.5 var(--ui);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.janela canvas.ceu{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.janela .app{position:absolute;inset:0}
.fraco{color:var(--txt3)}.suave{color:var(--txt2)}
.mono{font-family:var(--mono)}
.ponto{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.p-laranja{background:var(--laranja)}.p-verde{background:var(--verde)}.p-branco{background:var(--txt)}.p-cinza{background:var(--txt3)}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pilula{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--borda);border-radius:999px;padding:4px 11px;font-size:12.5px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--borda);border-radius:8px;padding:6px 12px;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--supa)}
.btn.prim{background:var(--acento);color:var(--sobre);border-color:transparent}
.cartao{background:color-mix(in srgb,var(--sup) 78%,transparent);border:1px solid var(--borda2);border-radius:12px}
.bolha{background:var(--bolha);border-radius:12px;padding:9px 14px;align-self:flex-end;max-width:76%}
.ferr{display:flex;gap:9px;align-items:center;padding:6px 12px;border-radius:9px;background:color-mix(in srgb,var(--sup) 70%,transparent);font-size:12.8px}
.ferr b{font-weight:600}
.codigo{background:var(--cod);color:var(--codt);font:12.5px/1.6 var(--mono);border-radius:9px;padding:10px 14px;white-space:pre}
.perm{border:1px solid color-mix(in srgb,var(--laranja) 60%,transparent);background:color-mix(in srgb,var(--laranja) 9%,var(--sup));border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.perm .acoes{display:flex;gap:8px}
.subag{border:1px solid var(--borda2);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:12.8px}
.etq{font-size:11px;padding:1px 7px;border-radius:5px;background:color-mix(in srgb,var(--marca) 30%,transparent)}
.composer{border:1px solid var(--borda);border-radius:14px;background:color-mix(in srgb,var(--sup) 85%,transparent);padding:11px 14px;display:grid;gap:12px}
.composer .rodape{display:flex;gap:8px;align-items:center}
.enviar{width:28px;height:28px;border-radius:50%;background:var(--acento);color:var(--sobre);display:grid;place-items:center;margin-left:auto}
.barra{height:5px;border-radius:9px;background:var(--supa);overflow:hidden}.barra i{display:block;height:100%;background:var(--txt);border-radius:9px}
.chave{width:34px;height:19px;border-radius:99px;background:var(--supa);border:1px solid var(--borda);position:relative;flex:none;cursor:pointer;transition:.2s}
.chave::after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--txt3);transition:.2s}
.chave.lig{background:var(--marca)}.chave.lig::after{left:17px;background:#fff}
.seg{display:inline-flex;border:1px solid var(--borda);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:4px 11px;border-radius:7px;font-size:12.8px;color:var(--txt2)}
.seg button.ativo{background:var(--supa);color:var(--txt)}
.campo{border:1px solid var(--borda);border-radius:8px;padding:6px 10px;font-size:13px;min-width:200px;display:inline-flex;justify-content:space-between;gap:10px;background:color-mix(in srgb,var(--sup) 60%,transparent)}
.temas{display:flex;gap:8px;flex-wrap:wrap}
.tema{width:96px;border:1px solid var(--borda);border-radius:10px;overflow:hidden;font-size:11.5px;cursor:pointer}
.tema.ativo{outline:2px solid var(--marca);outline-offset:1px}
.tema i{display:block;height:44px}
.tema span{display:block;padding:4px 7px}
.opcao{display:flex;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--borda2)}
.opcao:first-child{border-top:0}
.opcao .txt{flex:1;min-width:0}
.opcao .txt b{display:block;font-weight:500}
.opcao .txt small{display:block;color:var(--txt3);font-size:12.3px}
.lista-pastas{display:grid;gap:6px;min-width:300px}
.lista-pastas div{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--borda2);border-radius:8px;padding:5px 10px;font:12.5px var(--mono)}
.secao-t{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3);font-weight:600}
.estado-cor{color:var(--laranja)}
.sombra{box-shadow:0 18px 50px rgba(0,0,0,.35)}
.oculto{display:none!important}
</style>
</head>
<body>
<div class="controle">
  <div class="linha" style="justify-content:space-between">
    <div>
      <div class="titulo-pg">Nexora · três conceitos de layout</div>
      <div class="sub-pg">Clique nos conceitos, troque a tela e o tema. Dentro da janela, os botões, abas, seções e chaves funcionam.</div>
    </div>
    <div class="linha">
      <div class="alterna" id="telas"><button data-tela="conversa" class="ativo">Conversa</button><button data-tela="config">Configurações</button></div>
      <div class="alterna" id="temaSel"><button data-tema="escuro" class="ativo">Escuro</button><button data-tema="claro">Claro</button></div>
    </div>
  </div>
  <div class="conceitos" id="conceitos"></div>
</div>
<div class="palco" id="palco"><div class="janela" id="janela"><canvas class="ceu" id="ceu"></canvas><div class="app" id="app"></div></div></div>
<div class="controle"><div class="nota" id="notaConceito"></div></div>

<script>
const I = {
  quadro:'<path d="M4 5h4v14H4zM10 5h4v9h-4zM16 5h4v6h-4z"/>',
  chat:'<path d="M5 5h14v10H9l-4 4z"/>',
  projetos:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>',
  issues:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1.5"/>',
  relogio:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  grafico:'<path d="M5 19V9M10 19V5M15 19v-7M20 19v-4"/>',
  chip:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  engrenagem:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  busca:'<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/>',
  mais:'<path d="M12 5v14M5 12h14"/>',
  painel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',
  lateral:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
  pasta:'<path d="M3 6h6l2 2h10v11H3z"/>',
  branch:'<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10M18 10c0 4-6 3-12 7"/>',
  terminal:'<path d="m5 7 5 5-5 5M12 17h7"/>',
  play:'<path d="M7 5v14l11-7z"/>',
  seta:'<path d="M12 19V5M6 11l6-6 6 6"/>',
  clipe:'<path d="M20 11 12 19a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7"/>',
  baixo:'<path d="m6 9 6 6 6-6"/>',
  fechar:'<path d="M6 6l12 12M18 6 6 18"/>',
  raio:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  robo:'<rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 4v4M9 13h.01M15 13h.01"/>',
  paleta:'<circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1"/><circle cx="12" cy="7" r="1"/><circle cx="16" cy="10" r="1"/>',
  globo:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  pessoa:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
  janela:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',
  estrela:'<path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L3.4 9.3l6-.7z"/>'
};
const ic = (n, t) => `<svg class="ic" viewBox="0 0 24 24"${t?` style="width:${t}px;height:${t}px"`:''}>${I[n]}</svg>`;

const SESSOES = [
  {t:'Cupom de desconto no checkout', p:'Loja', b:'cupom-checkout', e:'Precisa de você', c:'p-laranja'},
  {t:'Orquestrador', p:'Loja', b:'dev', e:'Trabalhando', c:'p-branco'},
  {t:'Erro na tela de pedidos', p:'Loja-pedidos', b:'erro-tela-pedidos', e:'Precisa de você', c:'p-laranja'},
  {t:'Notas offline', p:'App.Notas', b:'notas-offline', e:'Pronta', c:'p-verde'},
];

const conversa = () => `
  <div class="bolha">Revise o cupom de desconto do checkout e me diga o que falta para fechar a issue 48.</div>
  <div class="fraco" style="font-size:12.5px;font-style:italic">Pensou por 7 s · 2,1 mil tokens</div>
  <div class="subag">${ic('robo',14)}<b style="font-weight:600">Mapear onde o cupom é validado</b><span class="etq">Explore</span><span class="fraco">terminou · 41 s · 7 ferramentas</span></div>
  <div style="display:grid;gap:8px">
    <div>Olhei a issue e o código do <span class="mono" style="color:var(--codt)">CupomService</span>. Faltam <b>duas coisas</b> antes de fechar a 48:</div>
    <div style="padding-left:14px">• <b>Cupom vencido:</b> hoje o serviço lança exceção; o certo é devolver uma falha que a tela mostre.<br>• <b>Limite por cliente:</b> o mesmo cupom pode ser usado duas vezes no mesmo pedido.</div>
    <div class="codigo">if (cupom.Vencido(agora))
    return Resultado.Falha("Este cupom venceu");</div>
  </div>
  <div class="ferr"><span class="ponto p-verde"></span><b>Read</b><span class="mono fraco">src/Loja.Application/Cupons/CupomService.cs</span></div>
  <div class="perm"><div style="display:flex;gap:8px;align-items:center"><span class="estado-cor">${ic('info',15)}</span><b>Permitir Bash: aplica a migration</b></div>
    <div class="codigo" style="padding:7px 12px">dotnet ef database update --project src/Loja.Infra</div>
    <div class="acoes"><button class="btn prim">Permitir</button><button class="btn">Não perguntar de novo</button><button class="btn">Negar</button></div></div>`;

const composer = (extra='') => `<div class="composer">
  <div class="fraco">Mensagem para o Claude · @ cita um arquivo · / lista comandos</div>
  <div class="rodape"><span class="fraco">${ic('clipe',15)}</span><span class="pilula">Opus 5.5 · Alto ${ic('baixo',12)}</span>${extra}<span class="pilula">${ic('raio',12)} Perguntar sempre</span><span class="enviar">${ic('seta',14)}</span></div></div>`;

const contexto = () => `<div style="display:grid;gap:7px">
  <div style="display:flex;justify-content:space-between"><b style="font-weight:600">28% usado</b><span class="fraco">291k de 1M</span></div>
  <div class="barra"><i style="width:28%"></i></div></div>`;

const SECOES = [
  {id:'aparencia', n:'Aparência', i:'paleta', d:'Tema, fundo animado e fontes'},
  {id:'idioma', n:'Idioma', i:'globo', d:'Português, English ou o do sistema'},
  {id:'conversas', n:'Conversas', i:'chat', d:'Modelo, esforço e permissões padrão'},
  {id:'projetos', n:'Projetos e pastas', i:'pasta', d:'Onde o Nexora procura repositórios'},
  {id:'mcp', n:'Servidores MCP', i:'chip', d:'Hub compartilhado entre sessões'},
  {id:'orquestrador', n:'Orquestrador', i:'robo', d:'Modelo da sessão chefe'},
  {id:'janela', n:'Janela', i:'janela', d:'Abertura, painéis e terminal'},
  {id:'sobre', n:'Sobre', i:'info', d:'Versão, atualizações e dados'},
];
const TEMAS = [
  ['Padrão','#181716','#948BAE'],['Padrão claro','#F7F6F4','#5B5470'],['Dracula','#282A36','#BD93F9'],['Alucard','#FFFBEB','#644AC9'],
  ['Aurora','#0B0E14','#7BCB9F'],['Nebulosa','#120F1A','#E59AC4'],['Carta celeste','#F4F1E8','#3A3548'],['Pulso','#0E0D12','#86C5E6']];
const opcao = (t, s, controle) => `<div class="opcao"><div class="txt"><b>${t}</b>${s?`<small>${s}</small>`:''}</div>${controle}</div>`;
const chave = (lig) => `<span class="chave${lig?' lig':''}" data-chave></span>`;
const seg = (ops, i=0) => `<span class="seg" data-seg>${ops.map((o,k)=>`<button class="${k===i?'ativo':''}">${o}</button>`).join('')}</span>`;
const campo = (v) => `<span class="campo">${v}${ic('baixo',13)}</span>`;
const CONTEUDO = {
  aparencia: () => opcao('Tema','O app inteiro muda na hora; os animados reagem ao mouse.', '') +
    `<div class="temas" style="padding:0 0 12px">${TEMAS.map((t,k)=>`<div class="tema${k===0?' ativo':''}" data-tema-card><i style="background:linear-gradient(135deg,${t[1]} 55%,${t[2]})"></i><span>${t[0]}</span></div>`).join('')}</div>` +
    opcao('Fundo','Animado, parado ou sem fundo', seg(['Animado','Parado','Sólido'])) +
    opcao('Escurecer o fundo','Deixa o texto mais legível sobre o céu', `<input type="range" value="20" style="width:180px;accent-color:var(--marca)">`) +
    opcao('Fonte da interface','', campo('Inter')) + opcao('Fonte do código','', campo('Cascadia Mono')),
  idioma: () => opcao('Idioma do app','Vale depois de reabrir o Nexora', seg(['Automático','Português','English'])) +
    opcao('Datas e números','Seguem o idioma escolhido', `<span class="fraco">06/11/2026 · 1.234,5</span>`),
  conversas: () => opcao('Modelo padrão','Usado nas conversas novas', campo('Opus 5.5')) + opcao('Esforço','', seg(['Baixo','Médio','Alto','Máximo'],2)) +
    opcao('Modo de permissão','Shift+Tab troca durante a conversa', campo('Perguntar sempre')) + opcao('Modo rápido','', chave(false)) +
    opcao('Avisar quando uma sessão precisar de você','Notificação do sistema', chave(true)),
  projetos: () => opcao('Pastas de projetos','O Nexora procura repositórios nestas pastas',
    `<div class="lista-pastas"><div>D:\\Repositorios <span class="fraco">${ic('fechar',12)}</span></div><div>D:\\Workspaces <span class="fraco">${ic('fechar',12)}</span></div><button class="btn" style="justify-self:start">${ic('mais',13)} Adicionar pasta</button></div>`) +
    opcao('Workspaces do VS Code','Cada .code-workspace vira um projeto', `<button class="btn">${ic('mais',13)} Importar</button>`) +
    opcao('Projetos escondidos','3 projetos fora da lista', `<button class="btn">Mostrar</button>`),
  mcp: () => opcao('Hub de MCP','Um servidor por projeto para todas as sessões, em vez de uma cópia por sessão', chave(true)) +
    opcao('Desligar MCP parado depois de','', campo('10 minutos')),
  orquestrador: () => opcao('Modelo da sessão chefe','', campo('Opus 5.5')) + opcao('Esforço','', seg(['Médio','Alto','Máximo'],1)),
  janela: () => opcao('Abrir pelo Nexora.exe','Abre mais rápido; desligue se o antivírus barrar', chave(true)) +
    opcao('Detalhes da sessão ao lado','Em janela em pé eles abrem por cima', chave(true)) +
    opcao('Altura do terminal','', campo('260 px')),
  sobre: () => opcao('Nexora 0.5.1','Atualizado hoje', `<button class="btn">Procurar atualização</button>`) +
    opcao('Boas-vindas','Rever o passeio de apresentação', `<button class="btn">Abrir</button>`) +
    opcao('Pasta de dados','%APPDATA%\\Nexora', `<button class="btn">Abrir pasta</button>`),
};
let secao = 'aparencia';

const C = {};

C.A = {
  nome:'A · Estação',
  desc:'Lista de sessões por estado à esquerda, conversa como documento no centro e um painel de contexto que se recolhe.',
  nota:'Estação: em vez da coluna de ícones do VS Code, a lateral é a própria lista de trabalho, agrupada por estado (Precisa de você, Trabalhando, Prontas), com as áreas do app em texto no topo. A conversa fica centrada como um documento. Contexto, branch e arquivos viram um painel que se recolhe num botão. Configurações: índice de seções à esquerda e cartões à direita, como um app de ajustes do sistema.',
  conversa(){
    const grupos = [['Precisa de você','p-laranja',[0,2]],['Trabalhando','p-branco',[1]],['Prontas','p-verde',[3]]];
    return `<div style="display:grid;grid-template-columns:270px 1fr ${estado.painel?'300px':'0px'};height:100%;transition:grid-template-columns .25s">
      <aside style="background:color-mix(in srgb,var(--lateral) 88%,transparent);border-right:1px solid var(--borda2);display:flex;flex-direction:column;padding:14px 12px;gap:14px">
        <div style="display:flex;align-items:center;gap:9px;padding:0 6px"><span style="width:26px;height:26px;border-radius:8px;background:linear-gradient(160deg,var(--marca),var(--marca2));display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px">N</span><b style="font-size:15px">Nexora</b><span style="margin-left:auto" class="fraco">${ic('busca',15)}</span></div>

const estado = {conceito:'A', tela:'conversa', tema:'escuro', painel:true, gaveta:false, cardAberto:null};
{
  const q = new URLSearchParams(location.search);
  if (C[q.get('c')]) estado.conceito = q.get('c');
  if (q.get('t') === 'config') estado.tela = 'config';
  if (q.get('tema') === 'claro') estado.tema = 'claro';
  if (q.get('gaveta')) estado.gaveta = true;
  if (q.get('card')) estado.cardAberto = q.get('card');
}

function desenhar(){
  document.getElementById('conceitos').innerHTML = Object.entries(C).map(([k,c])=>`<button class="conceito${estado.conceito===k?' ativo':''}" data-conceito="${k}"><b>${c.nome}</b><span>${c.desc}</span></button>`).join('');
  const c = C[estado.conceito];
  document.getElementById('app').innerHTML = c[estado.tela]();
  document.getElementById('notaConceito').textContent = c.nota;
  document.querySelectorAll('#telas button').forEach(b=>b.classList.toggle('ativo', b.dataset.tela===estado.tela));
  document.querySelectorAll('#temaSel button').forEach(b=>b.classList.toggle('ativo', b.dataset.tema===estado.tema));
  const j = document.getElementById('janela');
  j.classList.toggle('claro', estado.tema==='claro');
  document.body.classList.toggle('claro-pagina', estado.tema==='claro');
}

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-conceito],[data-tela],[data-tema],[data-ir],[data-acao],[data-secao],[data-card],[data-fechar],[data-fundo],[data-fundo-gaveta],[data-chave],[data-seg] button,[data-tema-card],[data-rolar]');
  if(!t) return;
  if(t.dataset.conceito){estado.conceito=t.dataset.conceito;estado.cardAberto=null;estado.gaveta=false;}
  else if(t.dataset.tela){estado.tela=t.dataset.tela;}
  else if(t.dataset.tema){estado.tema=t.dataset.tema;}
  else if(t.dataset.ir){estado.tela=t.dataset.ir;estado.cardAberto=null;estado.gaveta=false;}
  else if(t.dataset.acao==='painel'){estado.painel=!estado.painel;}
  else if(t.dataset.acao==='gaveta'){estado.gaveta=!estado.gaveta;}
  else if(t.dataset.secao){secao=t.dataset.secao;}
  else if(t.dataset.card){estado.cardAberto=t.dataset.card;}
  else if(t.hasAttribute('data-fechar')){estado.cardAberto=null;}
  else if(t.hasAttribute('data-fundo')){if(e.target.closest('[data-nao-fecha]'))return;estado.cardAberto=null;}
  else if(t.hasAttribute('data-fundo-gaveta')){estado.gaveta=false;}
  else if(t.hasAttribute('data-chave')){t.classList.toggle('lig');return;}
  else if(t.closest('[data-seg]')){t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('ativo',b===t));return;}
  else if(t.hasAttribute('data-tema-card')){t.parentElement.querySelectorAll('.tema').forEach(b=>b.classList.toggle('ativo',b===t));return;}
  else if(t.dataset.rolar){secao=t.dataset.rolar;const alvo=document.getElementById('s-'+secao);const r=document.getElementById('rolagemC');desenhar();const a2=document.getElementById('s-'+secao);document.getElementById('rolagemC').scrollTop=a2.offsetTop-10;return;}
  desenhar();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){estado.cardAberto=null;estado.gaveta=false;desenhar();} });

function escalar(){
  const p = document.getElementById('palco');
  document.getElementById('janela').style.transform = `scale(${p.clientWidth/1280})`;
}
addEventListener('resize', escalar);

const ceu = document.getElementById('ceu'), g = ceu.getContext('2d');
const estrelas = Array.from({length:140},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.2+.3,f:Math.random()*6.28,v:.4+Math.random()*1.2}));
const lig = [];
for(let i=0;i<18;i++){const a=estrelas[i*3],b=estrelas[i*3+1];if(Math.hypot(a.x-b.x,a.y-b.y)<.25)lig.push([a,b]);}
function animar(t){
  const w=ceu.width=1280,h=ceu.height=800;
  const cor=getComputedStyle(document.getElementById('janela')).getPropertyValue('--estrela').trim();
  g.clearRect(0,0,w,h);
  g.strokeStyle=`rgba(${cor},.08)`;g.lineWidth=1;
  for(const [a,b] of lig){g.beginPath();g.moveTo(a.x*w,a.y*h);g.lineTo(b.x*w,b.y*h);g.stroke();}
  for(const s of estrelas){const al=.25+.35*(.5+.5*Math.sin(t/1000*s.v+s.f));g.fillStyle=`rgba(${cor},${al})`;g.beginPath();g.arc(s.x*w,s.y*h,s.r,0,6.28);g.fill();}
  requestAnimationFrame(animar);
}
desenhar();escalar();requestAnimationFrame(animar);
</script>
